<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Base64 Decoder</title>
</head>
<body>
    <div class="container">
        <h1>Base64 Decoder</h1>
        <p>Welcome! This is where you can decode a base64 encoded message into utf-8</p>
        <input class="input"  type="text" placeholder="Please enter your base64 message here." >
        <button id="decode-btn">Decode</button>
        <button id="clear-btn">Clear</button>
        <p id="output">Your output will appear here.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
